[package]
name = "my_audio_player"
version = "0.1.0"
edition = "2024"

[dependencies]
gstreamer = "0.22"
eframe = "0.36"
egui = "0.36"
anyhow = "1.0"
rfd = "0.14"
modern-egui = "0.2"
egui-phosphor = "0.14"
egui-elegance = "0.16"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"


[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
